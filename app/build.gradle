plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pebblestories.demo'
    compileSdk 35

    defaultConfig {
        applicationId 'com.pebblestories.demo'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '0.2-demo'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}
